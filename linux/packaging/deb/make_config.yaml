display_name: iPing
package_name: iping
maintainer:
  name: long2ice
  email: 13377178+long2ice@users.noreply.github.com

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now iping-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/iping-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/iping

keywords:
  - iPing
  - Clash
  - ClashMeta
  - Proxy

generic_name: iPing

categories:
  - Network

startup_notify: true

startup_wm_class: my.iping.client

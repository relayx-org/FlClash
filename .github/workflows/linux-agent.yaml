name: linux-agent

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        default: ''
      stable:
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      version:
        type: string
        default: ''
      build_binaries:
        type: boolean
        default: false
      stable:
        type: boolean
        default: true
      reuse_web:
        type: boolean
        default: false
  pull_request:
    paths:
      - 'lib/**'
      - 'openwrt/**'
      - 'test/**'
      - 'pubspec.*'
      - '.github/workflows/linux-agent.yaml'
      - '.github/workflows/build.yaml'
      - 'tool/ci/openwrt_release.py'
      - 'tool/ci/storage.py'
      - 'tool/update_manifest.dart'

permissions:
  contents: read

concurrency:
  group: linux-agent-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: [self-hosted, Linux, X64]
    env:
      GOROOT: ''
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Use current installer test tooling
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          for path in tool/ci/native_targets.json test/tool/openwrt_installer_test.py test/tool/openwrt_release_test.py test/tool/storage_test.py tool/ci/storage.py tool/ci/openwrt_release.py openwrt/iping/files/iping-update; do
            git show "$TOOLS_SHA:$path" > "$path"
          done
      - name: Check binary release tooling
        env:
          IPING_INSTALLER_TEST_IMAGE: busybox:1.37.0
        run: python3 -B -m unittest discover -s test/tool -p '*_test.py'
      - name: Check installer shell compatibility
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/openwrt/iping/files/iping-update:/installer:ro" koalaman/shellcheck:v0.10.0 --shell=sh /installer
          docker run --rm -v "$GITHUB_WORKSPACE/openwrt/iping/files/iping.init:/init:ro" koalaman/shellcheck:v0.10.0 --shell=sh --exclude=SC2034 /init
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check Agent lifecycle and shared profile contract
        working-directory: openwrt/iping/src
        run: |
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/iping-arm64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -o "$RUNNER_TEMP/iping-mips" .

  ui:
    runs-on: [self-hosted, Linux, X64]
    env:
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      IS_STABLE: ${{ inputs.stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
      GOROOT: ''
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          submodules: recursive

      - uses: actions/setup-go@v5
        if: ${{ !inputs.reuse_web }}
        with:
          go-version: '1.27.1'
          cache: false

      - uses: subosito/flutter-action@v2
        if: ${{ !inputs.reuse_web }}
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Use current binary release tooling
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          for path in tool/ci/native_targets.json tool/ci/openwrt_release.py tool/ci/storage.py openwrt/iping/files/iping-update; do
            git show "$TOOLS_SHA:$path" > "$path"
          done

      - name: Set Web release version
        if: ${{ !inputs.reuse_web }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 tool/ci/openwrt_release.py prepare --release-version "$RELEASE_VERSION"

      - name: Resolve native dependencies
        if: ${{ !inputs.reuse_web }}
        run: flutter pub get

      - name: Resolve Web dependencies
        if: ${{ !inputs.reuse_web }}
        working-directory: openwrt/ui
        run: flutter pub get

      - name: Check shared native logic
        if: ${{ !inputs.reuse_web }}
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/iping test/common/task_test.dart test/common/javascript_test.dart test/models/rule_test.dart test/providers/setup_action_test.dart test/providers/setup_state_test.dart test/providers/database_test.dart test/providers/action_test.dart test/views/dns_view_test.dart test/views/network_config_test.dart test/views/added_rules_test.dart test/views/clash_providers_view_test.dart test/features/list_editor_page_test.dart test/features/custom_quick_edit_test.dart test/widgets/uncovered_views_test.dart test/manager/window_header_test.dart test/lint

      - name: Check Web logic
        if: ${{ !inputs.reuse_web }}
        working-directory: openwrt/ui
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build shared Flutter interface
        if: ${{ !inputs.reuse_web }}
        run: bash openwrt/build_ui.sh

      - name: Reuse the validated Web build from MinIO
        if: inputs.reuse_web
        run: python3 tool/ci/storage.py get --group web --path openwrt/iping/src/webui/dist

      - name: Save shared Web and installer to MinIO
        if: github.event_name == 'workflow_dispatch' || inputs.build_binaries
        run: |
          python3 tool/ci/storage.py put --group web --path openwrt/iping/src/webui/dist
          mkdir -p "$RUNNER_TEMP/iping-installer"
          install -m 755 openwrt/iping/files/iping-update "$RUNNER_TEMP/iping-installer/install-linux.sh"
          python3 tool/ci/storage.py put --group installer --path "$RUNNER_TEMP/iping-installer"

  binaries:
    if: ${{ github.event_name == 'workflow_dispatch' || inputs.build_binaries }}
    needs: [ui, agent]
    runs-on: [self-hosted, macOS, ARM64]
    env:
      RELEASE_SHA: ${{ inputs.ref || github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      IS_STABLE: ${{ inputs.stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      GOMAXPROCS: '4'
      GOFLAGS: -p=4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arch: [x86_64, aarch64, armv7, mips, mipsel]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Use current binary release tooling
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          for path in tool/ci/native_targets.json tool/ci/openwrt_release.py tool/ci/storage.py openwrt/iping/files/iping-update; do
            git show "$TOOLS_SHA:$path" > "$path"
          done

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Use local Go and Core download caches
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/iping/openwrt/go-build" "$RUNNER_TOOL_CACHE/iping/openwrt/go-mod"
          echo "GOCACHE=$RUNNER_TOOL_CACHE/iping/openwrt/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TOOL_CACHE/iping/openwrt/go-mod" >> "$GITHUB_ENV"

      - name: Load the verified Web build from MinIO
        run: python3 tool/ci/storage.py get --group web --path openwrt/iping/src/webui/dist

      - name: Cross-compile static Agent and reuse the pinned Core binary
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 tool/ci/openwrt_release.py build --arch "$ARCH" --release-version "$RELEASE_VERSION" \
            --cache "$RUNNER_TOOL_CACHE/iping/openwrt/mihomo"

      - name: Save Linux binaries to MinIO
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 tool/ci/storage.py put --group "agent-$ARCH" --path dist

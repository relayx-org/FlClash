name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, arc-runner-set]
    steps:
      - name: Build the published release with shared caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run build.yaml --repo "$GH_REPO" --ref main -f tag="$TAG"

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Build tagged release and publish directly to MinIO
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-pre.* ]]; then stable=false; else stable=true; fi
          gh workflow run build.yaml --repo "$GH_REPO" --ref main -f ref="$TAG" -f publish_stable="$stable"

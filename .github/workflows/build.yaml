name: build
run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: iping-build-${{ inputs.tag }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      stable: ${{ steps.resolve.outputs.stable }}
    steps:
      - name: Resolve published release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-pre\.[0-9]+)?$ ]]
          release="$(gh release view "$TAG" --json isDraft,isPrerelease)"
          test "$(jq -r .isDraft <<< "$release")" = false
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" >> "$GITHUB_OUTPUT"
          printf 'stable=%s\n' "$(jq -r '.isPrerelease | not' <<< "$release")" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    runs-on: ${{ matrix.os }}
    env:
      IS_STABLE: ${{ needs.release.outputs.stable }}
      GRADLE_OPTS: -Dorg.gradle.caching=true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      - name: Use current signing tooling
        if: matrix.platform == 'macos'
        shell: bash
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          git show "$TOOLS_SHA:tool/sign_macos.sh" > tool/sign_macos.sh

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          expected="v$version"
          if [[ "$TAG" == "$expected" ]] || [[ "$IS_STABLE" != true && "$TAG" == "$expected"-* ]]; then
            exit 0
          fi
          echo "Release tag $TAG does not match pubspec version $version" >&2
          exit 1

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE:?Set KEYSTORE to the existing Android release keystore}"
          : "${KEY_ALIAS:?Set KEY_ALIAS}"
          : "${STORE_PASSWORD:?Set STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Set KEY_PASSWORD}"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/go.sum

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.platform }}-${{ matrix.arch || 'multi' }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-on-failure: true

      - name: Restore native outputs
        uses: actions/cache@v4
        with:
          path: |
            libclash
            .dart_tool/setup_build_cache
            .dart_tool/hooks_runner
          key: native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('build_config.yaml', 'core/**', 'services/helper/src/**', 'services/helper/Cargo.*', 'services/helper/build.rs', 'plugins/setup/hook/**', 'plugins/setup/setup_hooks/lib/**', 'plugins/setup/setup_hooks/pubspec.*', 'plugins/setup/pubspec.*', 'plugins/rust_api/rust/src/**', 'plugins/rust_api/rust/Cargo.*', 'plugins/rust_api/rust/build.rs') }}
          restore-keys: |
            native-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ env.GO_VERSION }}-${{ env.FLUTTER_VERSION }}-

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ runner.os == 'Linux' && runner.arch == 'X64' }}
          pub-cache: true

      - name: Restore macOS packaging downloads
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: appdmg-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Import Apple signing material
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE:?Set MACOS_CERTIFICATE to the base64 Developer ID P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set MACOS_CERTIFICATE_PASSWORD}"
          : "${CODESIGN_IDENTITY:?Set CODESIGN_IDENTITY}"
          : "${APPLE_API_KEY:?Set APPLE_API_KEY}"
          : "${APPLE_API_PRIVATE_KEY:?Set APPLE_API_PRIVATE_KEY to the base64 P8}"
          : "${APPLE_API_ISSUER:?Set APPLE_API_ISSUER}"
          KEYCHAIN_FILE="$RUNNER_TEMP/iping-signing.keychain-db"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/iping-notary.p8"
          CERT_FILE="$RUNNER_TEMP/iping-signing.p12"
          printf 'KEYCHAIN_FILE=%s\nAPPLE_API_KEY_PATH=%s\n' "$KEYCHAIN_FILE" "$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          trap 'rm -f "$CERT_FILE"' EXIT
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_FILE"

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          CODESIGN_IDENTITY: ${{ matrix.platform == 'macos' && secrets.CODESIGN_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Cleanup Apple signing material
        if: always() && matrix.platform == 'macos'
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi
          rm -f "${APPLE_API_KEY_PATH:-}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    permissions:
      contents: write
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./iPing-* > SHA256SUMS

      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-minio:
    if: needs.release.outputs.stable == 'true'
    needs: [release, upload]
    runs-on: ubuntu-latest
    concurrency:
      group: iping-stable-release
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_ENDPOINT: https://minio.long2ice.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Use current manifest tooling
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          git show "$TOOLS_SHA:tool/update_manifest.dart" > tool/update_manifest.dart
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ runner.arch == 'ARM64' && 'master' || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Skip native build hooks
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
      - name: Prepare complete update release
        run: dart run tool/update_manifest.dart
      - name: Publish packages before the manifest
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}"
          aws configure set default.s3.addressing_style path
          aws s3 cp build/update-release/ s3://iping/releases/ --recursive --exclude latest.json --endpoint-url "$MINIO_ENDPOINT"
          aws s3 cp build/update-release/latest.json s3://iping/releases/latest.json --cache-control 'no-cache, no-store, must-revalidate' --content-type application/json --endpoint-url "$MINIO_ENDPOINT"

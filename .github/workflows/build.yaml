name: build

on:
  push:
    branches:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  IS_STABLE: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
  # See CI Caches in .agents/commands.md.
  BRANCH_CACHE: ${{ !startsWith(github.ref, 'refs/tags/') }}
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  dart:
    name: Dart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Test git hooks
        run: bash tool/hooks/test.sh

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Skip the Go core build hook
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: dart run tool/changelog.dart verify

      - name: Run tests
        run: dart run tool/test.dart -- --reporter expanded --coverage

      - name: Check coverage
        run: dart run tool/check_coverage.dart coverage/lcov.info 75

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  desktop:
    name: Desktop ${{ matrix.platform }}
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
          - platform: macos
            os: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.platform }}
          workspaces: |
            services/helper
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libayatana-appindicator3-dev libsecret-1-dev

      - name: Setup Xcode
        if: matrix.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Enable git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug bundle
        run: flutter build ${{ matrix.platform }} --debug

  go:
    name: Go core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          if ! compgen -G '*_test.go' > /dev/null; then
            echo 'No Go tests found in core/; the test step would pass vacuously.' >&2
            exit 1
          fi
          test -z "$(gofmt -l ./*.go ./cmd ./mobile ./platform ./tun)" || {
            gofmt -l ./*.go ./cmd ./mobile ./platform ./tun >&2
            exit 1
          }
          go test -count=1 .
          go vet . ./cmd/...
          GOOS=linux go vet ./platform

      - name: Validate the Android core library
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          tags="$(sed -n 's/^tags: *//p' ../build_config.yaml)"
          test -n "$tags" || { echo 'Could not read tags from build_config.yaml' >&2; exit 1; }
          GOOS=android GOARCH=arm64 go vet "-tags=$tags" . ./mobile ./tun ./platform

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: |
            core/go.sum
            android/core/build.gradle.kts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Install dependencies
        run: flutter pub get

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

      - name: Run Android unit tests
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          # No JVM unit test loads the Core or the Flutter build, but `:core` compiles against
          # the gomobile AAR, so one ABI of it is built.
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest \
            -Ptarget-platform=android-arm64 \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper
          save-if: ${{ env.BRANCH_CACHE }}

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: github.event_name == 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
            flutter-channel: master
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            flutter-channel: master

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate release tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          test -n "$version"
          expected="v$version"
          if [[ "$TAG" == "$expected" ]] || [[ "$IS_STABLE" != true && "$TAG" == "$expected"-* ]]; then
            exit 0
          fi
          echo "Release tag $TAG does not match pubspec version $version" >&2
          exit 1

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE:?Set KEYSTORE to the existing Android release keystore}"
          : "${KEY_ALIAS:?Set KEY_ALIAS}"
          : "${STORE_PASSWORD:?Set STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Set KEY_PASSWORD}"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}
          cache-dependency-path: core/go.sum

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ env.BRANCH_CACHE }}

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Import Apple signing material
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE:?Set MACOS_CERTIFICATE to the base64 Developer ID P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set MACOS_CERTIFICATE_PASSWORD}"
          : "${CODESIGN_IDENTITY:?Set CODESIGN_IDENTITY}"
          : "${APPLE_API_KEY:?Set APPLE_API_KEY}"
          : "${APPLE_API_PRIVATE_KEY:?Set APPLE_API_PRIVATE_KEY to the base64 P8}"
          : "${APPLE_API_ISSUER:?Set APPLE_API_ISSUER}"
          KEYCHAIN_FILE="$RUNNER_TEMP/iping-signing.keychain-db"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/iping-notary.p8"
          CERT_FILE="$RUNNER_TEMP/iping-signing.p12"
          printf 'KEYCHAIN_FILE=%s\nAPPLE_API_KEY_PATH=%s\n' "$KEYCHAIN_FILE" "$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          trap 'rm -f "$CERT_FILE"' EXIT
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security list-keychains -d user -s "$KEYCHAIN_FILE" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_FILE"

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
          CODESIGN_IDENTITY: ${{ matrix.platform == 'macos' && secrets.CODESIGN_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Cleanup Apple signing material
        if: always() && matrix.platform == 'macos'
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi
          rm -f "${APPLE_API_KEY_PATH:-}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    if: github.event_name == 'release'
    permissions:
      contents: write
    needs: [ build, dart, plugins, go, android, rust, windows-helper-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./iPing-* > SHA256SUMS

      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

  publish-minio:
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: upload
    runs-on: ubuntu-latest
    concurrency:
      group: iping-stable-release
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_ENDPOINT: https://minio.long2ice.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: artifact-*
          merge-multiple: true
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ runner.arch == 'ARM64' && 'master' || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get
      - name: Skip native build hooks
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
      - name: Prepare complete update release
        run: dart run tool/update_manifest.dart
      - name: Publish packages before the manifest
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?Set MINIO_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?Set MINIO_SECRET_ACCESS_KEY}"
          aws configure set default.s3.addressing_style path
          aws s3 cp build/update-release/ s3://iping/releases/ --recursive --exclude latest.json --endpoint-url "$MINIO_ENDPOINT"
          aws s3 cp build/update-release/latest.json s3://iping/releases/latest.json --cache-control 'no-cache, no-store, must-revalidate' --content-type application/json --endpoint-url "$MINIO_ENDPOINT"

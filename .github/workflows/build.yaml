name: build
run-name: MinIO release ${{ inputs.ref || 'main' }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to build
        type: string
        default: main
      publish_stable:
        description: Update the stable installer and manifest after verification
        type: boolean
        default: true
      reuse_run_id:
        description: Previous MinIO build run of the same release source to reuse
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: iping-build-${{ inputs.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c

jobs:
  release:
    runs-on: [self-hosted, Linux, X64]
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
      stable: ${{ steps.resolve.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - name: Resolve the exact source and package version
        id: resolve
        env:
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
        run: |
          python3 - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          match = re.search(r'^version: (\d+\.\d+\.\d+\+[1-9]\d*)$', Path('pubspec.yaml').read_text(), re.M)
          if not match:
              raise ValueError('Invalid application version')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('sha=' + sha + '\nversion=' + match[1] + '\nstable=' + os.environ['PUBLISH_STABLE'] + '\n')
          PYCODE

  plan:
    needs: release
    runs-on: [self-hosted, Linux, X64]
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - name: Reuse completed MinIO build groups and select remaining targets
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          PREVIOUS_RUN: ${{ inputs.reuse_run_id }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          IS_STABLE: ${{ needs.release.outputs.stable }}
        run: python3 tool/ci/storage.py plan --reuse-run "$PREVIOUS_RUN"

  build:
    if: ${{ needs.plan.outputs.matrix != '{"include":[]}' }}
    needs: [release, plan]
    runs-on: ${{ matrix.runner }}
    env:
      IS_STABLE: ${{ needs.release.outputs.stable }}
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      GRADLE_OPTS: -Dorg.gradle.caching=true
      FLUTTER_STORAGE_BASE_URL: ${{ (matrix.platform == 'android' || matrix.platform == 'linux') && 'https://storage.flutter-io.cn' || 'https://storage.googleapis.com' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
          submodules: recursive

      - name: Use current build tooling
        shell: bash
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3; do
            if git fetch --no-tags --depth=1 origin "$TOOLS_SHA"; then break; fi
            [ "$attempt" -lt 3 ] || exit 1
            sleep 5
          done
          mkdir -p tool/ci
          for path in setup.dart plugins/setup/setup_hooks/lib/src/core_builder.dart plugins/rust_api/rust/rust-toolchain.toml tool/sign_macos.sh tool/package_ios.dart tool/build_ios_core.dart tool/ci/ios_signing.py tool/ci/cache.sh tool/ci/cache.ps1 tool/ci/storage.py tool/ci/native_targets.json; do
            git show "$TOOLS_SHA:$path" > "$path"
          done

      - name: Set up Windows upload tooling
        if: runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check MinIO upload tooling
        shell: bash
        run: aws --version

      - name: Validate the pinned release version
        shell: bash
        run: |
          test "$(sed -n 's/^version: *//p' pubspec.yaml)" = "$RELEASE_VERSION"

      - name: Reuse local Unix build caches
        if: runner.os != 'Windows'
        run: bash tool/ci/cache.sh '${{ matrix.platform }}-${{ matrix.arch }}'

      - name: Reuse local Windows build caches
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tool/ci/cache.ps1 '${{ matrix.platform }}-${{ matrix.arch }}'

      - name: Read pinned Rust version
        id: rust-version
        shell: bash
        run: |
          version="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' plugins/rust_api/rust/rust-toolchain.toml)"
          test -n "$version"
          printf 'toolchain=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-version.outputs.toolchain }}
          targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios' || matrix.platform == 'macos' && matrix.arch == 'amd64' && 'x86_64-apple-darwin' || '' }}

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE:?Set KEYSTORE to the existing Android release keystore}"
          : "${KEY_ALIAS:?Set KEY_ALIAS}"
          : "${STORE_PASSWORD:?Set STORE_PASSWORD}"
          : "${KEY_PASSWORD:?Set KEY_PASSWORD}"
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Use selected Go toolchain
        shell: bash
        run: |
          unset GOROOT
          printf 'GOROOT=%s\n' "$(go env GOROOT)" >> "$GITHUB_ENV"

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: startsWith(matrix.platform,'android')
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Use Clang for Windows Rust C dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $clang = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe' | Select-Object -First 1
          if (-not $clang) { throw 'Install the Visual Studio C++ Clang tools on this runner.' }
          if (Test-Path .cargo/config.toml) { throw 'Merge the CI C compiler with the existing Cargo configuration.' }
          New-Item -ItemType Directory -Force -Path .cargo | Out-Null
          @('[build]', 'jobs = 2', '', '[env]', "CC_x86_64_pc_windows_msvc = { value = '$clang', force = true }") | Set-Content .cargo/config.toml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
          pub-cache: false

      - name: Setup Xcode
        if: matrix.platform == 'macos' || matrix.platform == 'ios'
        run: xcodebuild -version

      - name: Select macOS target architecture
        if: matrix.platform == 'macos'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          arch = os.environ['MACOS_ARCH']
          config = Path(os.environ['RUNNER_TEMP']) / 'iping-architecture.xcconfig'
          config.write_text('ARCHS = ' + ('x86_64' if arch == 'amd64' else 'arm64') + '\nONLY_ACTIVE_ARCH = NO\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'XCODE_XCCONFIG_FILE={config}\n')
          pubspec = Path('pubspec.yaml')
          source = pubspec.read_text()
          assert source.count('    setup:\n') == 1
          pubspec.write_text(source.replace('    setup:\n', f'    setup:\n      macos_architecture: {arch}\n'))
          PY

      - name: Import Apple signing material
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          : "${MACOS_CERTIFICATE:?Set MACOS_CERTIFICATE to the base64 Developer ID P12}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Set MACOS_CERTIFICATE_PASSWORD}"
          : "${CODESIGN_IDENTITY:?Set CODESIGN_IDENTITY}"
          : "${APPLE_API_KEY:?Set APPLE_API_KEY}"
          : "${APPLE_API_PRIVATE_KEY:?Set APPLE_API_PRIVATE_KEY to the base64 P8}"
          : "${APPLE_API_ISSUER:?Set APPLE_API_ISSUER}"
          KEYCHAIN_FILE="$RUNNER_TEMP/iping-signing.keychain-db"
          APPLE_API_KEY_PATH="$RUNNER_TEMP/iping-notary.p8"
          CERT_FILE="$RUNNER_TEMP/iping-signing.p12"
          printf 'KEYCHAIN_FILE=%s\nAPPLE_API_KEY_PATH=%s\n' "$KEYCHAIN_FILE" "$APPLE_API_KEY_PATH" >> "$GITHUB_ENV"
          trap 'rm -f "$CERT_FILE"' EXIT
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_FILE"
          printf '%s' "$APPLE_API_PRIVATE_KEY" | base64 --decode > "$APPLE_API_KEY_PATH"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_FILE"
          security find-identity -v -p codesigning "$KEYCHAIN_FILE"

      - name: Prepare iOS distribution signing
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_TUNNEL_PROVISIONING_PROFILE: ${{ secrets.IOS_TUNNEL_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          : "${IOS_CERTIFICATE:?Set IOS_CERTIFICATE to the base64 Apple Distribution P12}"
          : "${IOS_CERTIFICATE_PASSWORD:?Set IOS_CERTIFICATE_PASSWORD}"
          : "${IOS_PROVISIONING_PROFILE:?Set the iPing App Store provisioning profile}"
          : "${IOS_TUNNEL_PROVISIONING_PROFILE:?Set the PacketTunnel App Store provisioning profile}"
          signing_dir="$(mktemp -d "$RUNNER_TEMP/iping-ios-signing-XXXXXX")"
          printf 'IOS_SIGNING_DIR=%s\n' "$signing_dir" >> "$GITHUB_ENV"
          python3 tool/ci/ios_signing.py prepare "$signing_dir"

      # setup-ndk stores r28c under a non-semver key that tool-cache cannot find.
      - name: Reuse cached NDK
        if: matrix.platform == 'android'
        id: ndk-cache
        run: |
          ndk="$RUNNER_TOOL_CACHE/ndk/$NDK_VERSION/${RUNNER_ARCH,,}"
          if [ -f "$ndk.complete" ] && [ -f "$ndk/source.properties" ]; then
            version="$(sed -n 's/^Pkg\.Revision *= *//p' "$ndk/source.properties" | tr -d '\r')"
            test -n "$version"
            mkdir -p "$ANDROID_HOME/ndk"
            if [ ! -e "$ANDROID_HOME/ndk/$version" ]; then
              ln -sfn "$ndk" "$ANDROID_HOME/ndk/$version"
            fi
            printf '%s\n' "$ndk" >> "$GITHUB_PATH"
            printf 'path=%s\n' "$ndk" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup NDK
        if: matrix.platform == 'android' && steps.ndk-cache.outputs.path == ''
        uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # See .agents/flutter-upgrade.md before bumping FLUTTER_VERSION.
      - name: Disable Impeller on Intel macOS
        if: matrix.platform == 'macos' && matrix.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk-cache.outputs.path || steps.build-ndk.outputs.ndk-path }}
          CODESIGN_IDENTITY: ${{ matrix.platform == 'macos' && secrets.CODESIGN_IDENTITY || '' }}
          APPLE_API_KEY: ${{ matrix.platform == 'macos' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'macos' && secrets.APPLE_API_ISSUER || '' }}
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Verify macOS target architecture
        if: matrix.platform == 'macos'
        env:
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          arch="$MACOS_ARCH"
          [ "$arch" != amd64 ] || arch=x86_64
          app=build/macos/Build/Products/Release/iPing.app
          xcrun lipo -verify_arch "$arch" "$app/Contents/MacOS/iPing"
          xcrun lipo -verify_arch "$arch" "$app/Contents/MacOS/iPingCore"
          xcrun lipo -verify_arch "$arch" "$app/Contents/Frameworks/rust_api.framework/rust_api"

      - name: Verify iOS IPA contents
        if: matrix.platform == 'ios'
        run: |
          check="$RUNNER_TEMP/iping-ios-package"
          mkdir -p "$check"
          unzip -q dist/iPing-*-ios-arm64.ipa -d "$check"
          xcrun lipo -verify_arch arm64 "$check/Payload/Runner.app/Runner"
          xcrun lipo -verify_arch arm64 "$check/Payload/Runner.app/PlugIns/PacketTunnel.appex/PacketTunnel"
          codesign --verify --deep --strict "$check/Payload/Runner.app"
          codesign --verify --strict "$check/Payload/Runner.app/PlugIns/PacketTunnel.appex"
          test -s "$check/Payload/Runner.app/embedded.mobileprovision"
          test -s "$check/Payload/Runner.app/PlugIns/PacketTunnel.appex/embedded.mobileprovision"

      - name: Cleanup Android signing material
        if: always() && matrix.platform == 'android'
        run: |
          rm -f android/app/keystore.jks
          python3 - <<'PY'
          from pathlib import Path
          properties = Path('android/local.properties')
          if properties.exists():
              lines = properties.read_text().splitlines()
              properties.write_text(''.join(line + '\n' for line in lines if not line.startswith(('keyAlias=', 'storePassword=', 'keyPassword='))))
          PY

      - name: Cleanup Apple signing material
        if: always() && matrix.platform == 'macos'
        run: |
          if [ -n "${KEYCHAIN_FILE:-}" ]; then
            security delete-keychain "$KEYCHAIN_FILE"
          fi
          rm -f "${APPLE_API_KEY_PATH:-}"

      - name: Cleanup iOS signing material
        if: always() && matrix.platform == 'ios'
        run: |
          if [ -n "${IOS_SIGNING_DIR:-}" ]; then
            python3 tool/ci/ios_signing.py cleanup "$IOS_SIGNING_DIR"
          fi

      - name: Save native packages to MinIO
        shell: bash
        env:
          GROUP: ${{ matrix.platform }}-${{ matrix.arch }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tool/ci/storage.py put --group "$GROUP" --path dist

  linux-agent:
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.plan.result == 'success' }}
    needs: [release, plan]
    uses: ./.github/workflows/linux-agent.yaml
    with:
      ref: ${{ needs.release.outputs.sha }}
      version: ${{ needs.release.outputs.version }}
      stable: ${{ inputs.publish_stable }}
      build_binaries: true
      reuse_web: ${{ needs.plan.outputs.web == 'true' }}
    secrets: inherit

  publish-minio:
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.linux-agent.result == 'success' && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    needs: [release, plan, build, linux-agent]
    runs-on: [self-hosted, Linux, X64]
    concurrency:
      group: iping-stable-release
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ needs.release.outputs.sha }}
      RELEASE_VERSION: ${{ needs.release.outputs.version }}
      IS_STABLE: ${{ needs.release.outputs.stable }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      MINIO_ENDPOINT: https://minio.long2ice.io
      FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.sha }}
      - name: Use current manifest tooling
        env:
          TOOLS_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLS_SHA"
          for path in tool/update_manifest.dart tool/ci/storage.py tool/ci/native_targets.json tool/publish_update.sh; do
            git show "$TOOLS_SHA:$path" > "$path"
          done
      - name: Load verified release packages from MinIO
        run: python3 tool/ci/storage.py collect --path dist
      - name: Use local package cache
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/iping/pub"
          echo "PUB_CACHE=$RUNNER_TOOL_CACHE/iping/pub" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
          pub-cache: false
      - run: flutter pub get
      - name: Skip native build hooks
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
      - name: Publish verified packages and then the stable update manifest
        env:
          STABLE: ${{ needs.release.outputs.stable }}
          RCLONE_CONFIG_MINIO_TYPE: s3
          RCLONE_CONFIG_MINIO_PROVIDER: Minio
          RCLONE_CONFIG_MINIO_ACCESS_KEY_ID: ${{ secrets.MINIO_ACCESS_KEY_ID }}
          RCLONE_CONFIG_MINIO_SECRET_ACCESS_KEY: ${{ secrets.MINIO_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_MINIO_ENDPOINT: https://minio.long2ice.io
          RCLONE_CONFIG_MINIO_FORCE_PATH_STYLE: 'true'
        run: |
          if [ "$STABLE" = true ]; then
            bash tool/publish_update.sh
          else
            export IPING_PUBLISH_LATEST=0
            export IPING_UPDATE_REMOTE="minio:iping/releases/previews/$GITHUB_RUN_ID"
            bash tool/publish_update.sh --base-url "https://video.iping.my/releases/previews/$GITHUB_RUN_ID/"
          fi

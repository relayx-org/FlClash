name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tool/build_site.sh'
      - 'tool/render_site.mjs'
      - '.github/workflows/pages.yaml'
  workflow_run:
    workflows:
      - build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.lookup.outputs.stable }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Look up the tag
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
               [[ "$(gh release view "$tag" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" == true ]]; then
              echo 'stable=true' >> "$GITHUB_OUTPUT"
              break
            fi
          done < <(git tag --points-at "$SHA")

  deploy:
    needs: tag
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_run' || needs.tag.outputs.stable == 'true')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tool/build_site.sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
